project:
  start_date: "2000-01-01"
  timezone: "Asia/Hong_Kong"
  random_seed: 42

data:
  request_timeout_seconds: 15
  request_retries: 2
  cache_max_age_hours: 24
  publication_lags_business_days:
    fred_daily: 1
    fred_weekly: 5
    ofr_fsi: 2
    french_daily: 1
    cboe_daily: 1
    price_proxy_daily: 1

  fred:
    enabled: true
    series:
      hy_oas: BAMLH0A0HYM2
      ig_oas: BAMLC0A0CM
      yield_curve_10y2y: T10Y2Y
      yield_curve_10y3m: T10Y3M
      financial_conditions: NFCI
      fed_stress: STLFSI4

  cboe:
    enabled: true
    vix_url: "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"

  ofr:
    enabled: true
    fsi_url: "https://www.financialresearch.gov/financial-stress-index/data/fsi.csv"

  french:
    enabled: true
    base_url: "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp"
    datasets:
      ff5: F-F_Research_Data_5_Factors_2x3_daily_CSV.zip
      momentum: F-F_Momentum_Factor_daily_CSV.zip
      short_reversal: F-F_ST_Reversal_Factor_daily_CSV.zip
      long_reversal: F-F_LT_Reversal_Factor_daily_CSV.zip

  nasdaq:
    enabled: true
    base_url: "https://api.nasdaq.com/api/quote"
    history_years: 10
    min_request_interval_seconds: 1.5
    max_jitter_seconds: 0.5
    cooldown_seconds: 60
    symbols:
      spy: SPY
      qqq: QQQ
      rsp: RSP
      iwm: IWM
      iwf: IWF
      iwd: IWD
      mtum: MTUM
      qual: QUAL
      usmv: USMV
      hyg: HYG
      lqd: LQD
      tlt: TLT
      gld: GLD

  megadb:
    enabled: false

ibkr:
  enabled: true
  auto_connect: false
  host: "127.0.0.1"
  port: 7496
  client_id: 91
  timeout_seconds: 12
  market_data_type: 4  # delayed-frozen; suitable for the post-close workflow
  readonly_required: true
  historical_requires_env_flag: true
  snapshot_symbols: [SPY, QQQ, IWM, IWF, IWD, MTUM, QUAL, USMV, HYG, LQD, TLT]

features:
  volatility_windows: [20, 60]
  momentum_windows: [21, 63, 252]
  style_windows: [21, 63, 126]
  rolling_normalization_window: 756

models:
  market_state:
    n_states: 3
    n_init: 3
    minimum_train_observations: 756
    refit_every_observations: 63
    gmm_weight: 0.70
    persistence_alpha: 0.35
  style:
    score_temperature: 1.25

reporting:
  history_years: 5
  inline_plotly: true
